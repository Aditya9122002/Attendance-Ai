<circle r="7" fill="#f8fafc" filter="url(#glow)"><animateMotion dur="12.0s" repeatCount="indefinite" path="M110,174.0 L850,174.0" keyPoints="0;1;1" keyTimes="0;0.76;1" calcMode="linear"/><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.02;0.76;0.8;1" values="0;1;1;0;0"/></circle>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="16">
<text x="480.0" y="298" fill="#e2e8f0" font-weight="400" opacity="0">1 · A teacher marks a student absent<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.155;0.17;1" values="1;1;0;0"/></text>
<text x="480.0" y="298" fill="#e2e8f0" font-weight="400" opacity="0">2 · The system records it and creates exactly one absence event<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.17;0.185;0.345;0.36;1" values="0;0;1;1;0;0"/></text>
<text x="480.0" y="298" fill="#e2e8f0" font-weight="400" opacity="0">3 · The parent gets a call from the automated assistant<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.36;0.375;0.535;0.55;1" values="0;0;1;1;0;0"/></text>
<text x="480.0" y="298" fill="#e2e8f0" font-weight="400" opacity="0">4 · The AI understands the reply; plain code decides what happens next<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.55;0.565;0.725;0.74;1" values="0;0;1;1;0;0"/></text>
<text x="480.0" y="298" fill="#e2e8f0" font-weight="400" opacity="0">5 · The confirmed reason and return date appear on the dashboard<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.74;0.755;0.915;0.93;1" values="0;0;1;1;0;0"/></text>
<text x="480.0" y="298" fill="#34d399" font-weight="600" opacity="0">Nothing is guessed. Anything unclear goes to a human.<animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.93;0.945;0.985;1" values="0;0;1;1;0"/></text>
</g>
